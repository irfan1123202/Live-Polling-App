services:
  - type: web
    name: pulsepoll-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: GO_VERSION
        value: "1.24.0"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: livepolling
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
