services:
  - type: web
    name: pulsepoll-backend
    env: go
    buildCommand: cd backend && go build -o server ./cmd/server
    startCommand: cd backend && ./server
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: livepolling
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
